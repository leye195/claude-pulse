appId: com.claude-pulse.app
productName: Claude Pulse
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: build
    to: build
    filter:
      - iconTemplate.png
      - iconTemplate@2x.png
      - iconTemplateAlert.png
      - iconTemplateAlert@2x.png
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
